<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:5000 http://localhost:5000 https://*.onrender.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Health Assistant</title>
    <meta name="description" content="Sign in to your AI Health Assistant dashboard to monitor your health data and access personalized recommendations.">
    <link rel="stylesheet" href="../css/dashboard-new.css">
</head>

<body style="margin:0;padding:0;">
    <div class="auth-wrapper">
        <div>
            <div class="auth-card" id="loginCard">
                <h2 id="loginTitle">🏥 Welcome Back</h2>
                <p class="auth-subtitle" id="loginSubtitle">Sign in to your health dashboard</p>

                <!-- Toggle: User / Admin -->
                <div class="auth-toggle-container">
                    <button class="auth-toggle-btn active" id="toggleUser" onclick="switchMode('user')">
                        👤 User Login
                    </button>
                    <button class="auth-toggle-btn" id="toggleAdmin" onclick="switchMode('admin')">
                        🛡️ Admin Login
                    </button>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div style="text-align:right;margin-bottom:.75rem;">
                        <a href="#" onclick="openForgotModal();return false;" style="font-size:.82rem;color:var(--primary-green);font-weight:600;">Forgot Password?</a>
                    </div>

                    <div class="auth-error" id="loginError"></div>

                    <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">Sign In</button>
                </form>

                <div class="auth-divider"><span>or</span></div>

                <div class="auth-links">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>

            <div class="back-link">
                <a href="../index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-card" style="max-width:420px;">
            <button class="modal-close" onclick="closeForgotModal()">×</button>
            <h2 style="text-align:center;">🔐 Reset Password</h2>
            <p style="text-align:center;color:var(--text-secondary);font-size:.88rem;margin-bottom:1.5rem;">Enter your email and we'll send you a reset link</p>
            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" placeholder="your@email.com">
            </div>
            <div class="auth-error" id="forgotError" style="display:none;"></div>
            <div id="forgotHint" style="display:none;margin-bottom:1rem;padding:.65rem 1rem;background:var(--bg-main);border-radius:8px;border-left:3px solid var(--accent-green);font-size:.85rem;color:var(--text-secondary);word-break:break-all;"></div>
            <button class="auth-submit-btn" id="forgotSubmitBtn" onclick="sendForgotReset()">📨 Send Reset Link</button>
        </div>
    </div>

    <script src="../js/api-config.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let currentMode = 'user';

        function switchMode(mode) {
            currentMode = mode;
            const card = document.getElementById('loginCard');
            const toggleUser = document.getElementById('toggleUser');
            const toggleAdmin = document.getElementById('toggleAdmin');
            const title = document.getElementById('loginTitle');
            const subtitle = document.getElementById('loginSubtitle');
            const errEl = document.getElementById('loginError');

            errEl.style.display = 'none';
            errEl.textContent = '';

            if (mode === 'admin') {
                card.classList.add('admin-mode');
                toggleAdmin.classList.add('active');
                toggleUser.classList.remove('active');
                title.textContent = '🛡️ Admin Login';
                subtitle.textContent = 'Administrator access only';
            } else {
                card.classList.remove('admin-mode');
                toggleUser.classList.add('active');
                toggleAdmin.classList.remove('active');
                title.textContent = '🏥 Welcome Back';
                subtitle.textContent = 'Sign in to your health dashboard';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');

            errEl.style.display = 'none';
            errEl.textContent = '';

            if (!email || !password) {
                errEl.textContent = 'Please fill in all fields.';
                errEl.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await window.healthAssistant.apiRequest('/auth/login', 'POST', { email, password });

                if (!response || !response.token) {
                    // If response is null, apiRequest already showed the error toast
                    if (response === null) {
                        // Auth error already handled by apiRequest (401/422)
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In';
                        return;
                    }
                    throw new Error('Invalid response from server');
                }

                if (currentMode === 'admin') {
                    if (response.role !== 'admin') {
                        errEl.textContent = 'Access denied. Admin credentials required.';
                        errEl.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In';
                        return;
                    }

                    localStorage.setItem('userToken', response.token);
                    localStorage.setItem('userName', response.name);
                    localStorage.setItem('userRole', 'admin');
                    localStorage.setItem('userData', JSON.stringify({
                        user_id: response.user_id,
                        name: response.name,
                        email: response.email,
                        role: 'admin'
                    }));

                    window.healthAssistant.showToast('Admin login successful!', 'success');
                    setTimeout(function () {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    localStorage.setItem('userToken', response.token);
                    localStorage.setItem('userName', response.name);
                    const role = response.role || 'user';
                    localStorage.setItem('userRole', role);
                    localStorage.setItem('userData', JSON.stringify({
                        user_id: response.user_id,
                        name: response.name,
                        email: response.email,
                        role: role
                    }));

                    window.healthAssistant.showToast('Login successful!', 'success');
                    const redirect = role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
                    setTimeout(function () {
                        window.location.href = redirect;
                    }, 1000);
                }
            } catch (err) {
                errEl.textContent = err.message || 'Login failed. Please try again.';
                errEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        // Check URL params for pre-selecting admin mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') {
            switchMode('admin');
        }

        // ─── FORGOT PASSWORD MODAL ──────────────────────────────────────
        function openForgotModal() {
            document.getElementById('forgotModal').classList.add('active');
            document.getElementById('forgotError').style.display = 'none';
            document.getElementById('forgotHint').style.display = 'none';
        }
        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }
        window.addEventListener('click', function(e) {
            if (e.target === document.getElementById('forgotModal')) closeForgotModal();
        });

        async function sendForgotReset() {
            const email = document.getElementById('forgotEmail').value.trim();
            const errorEl = document.getElementById('forgotError');
            const hintEl = document.getElementById('forgotHint');
            const btn = document.getElementById('forgotSubmitBtn');

            errorEl.style.display = 'none';
            hintEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email address';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const resp = await fetch(API_BASE_URL + '/settings/request-password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email }),
                });
                const data = await resp.json();

                if (data.hint) {
                    hintEl.innerHTML = data.hint;
                    hintEl.style.display = 'block';
                } else {
                    hintEl.textContent = data.message || 'Check your email for the reset link.';
                    hintEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = 'Cannot connect to server';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '📨 Send Reset Link';
            }
        }
    </script>
</body>

</html>
