<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Health Assistant</title>
    <meta name="description" content="Reset your password using the secure link sent to your email.">
    <link rel="stylesheet" href="../css/dashboard-new.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <div class="reset-page-wrapper">
        <div class="reset-card">
            <div class="reset-icon">🔐</div>
            <h2>Reset Your Password</h2>
            <p class="reset-subtitle">Enter your new password below</p>

            <div id="resetForm">
                <div class="auth-error" id="resetError"></div>
                <div class="form-group">
                    <label for="newResetPass">New Password</label>
                    <input type="password" id="newResetPass" placeholder="Enter new password (min 6 chars)">
                </div>
                <div class="form-group">
                    <label for="confirmResetPass">Confirm New Password</label>
                    <input type="password" id="confirmResetPass" placeholder="Confirm new password">
                </div>
                <button class="auth-submit-btn" id="resetSubmitBtn" onclick="resetPassword()">🔒 Reset Password</button>
            </div>

            <div id="resetSuccess" style="display:none;">
                <div class="reset-success">
                    <p>✅ Your password has been reset successfully!</p>
                    <p style="margin-top:1rem;"><a href="login.html" style="color:var(--primary-green);font-weight:700;font-size:1rem;">← Go to Login</a></p>
                </div>
            </div>

            <div id="resetExpired" style="display:none;">
                <div class="reset-success" style="color:var(--status-pending);">
                    <p>⚠️ This reset link is invalid or has expired.</p>
                    <p style="margin-top:1rem;"><a href="login.html" style="color:var(--primary-green);font-weight:700;font-size:.95rem;">← Back to Login</a></p>
                </div>
            </div>

            <div class="back-link" style="margin-top:1.5rem;">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Use global API_BASE_URL from api-config.js if available
        const API_BASE = (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : 'http://localhost:5000/api';

        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token') || '';
        }

        document.addEventListener('DOMContentLoaded', function () {
            const token = getTokenFromURL();
            if (!token) {
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('resetExpired').style.display = 'block';
            }
        });

        async function resetPassword() {
            const token = getTokenFromURL();
            const newPass = document.getElementById('newResetPass').value;
            const confirmPass = document.getElementById('confirmResetPass').value;
            const errorEl = document.getElementById('resetError');

            errorEl.style.display = 'none';

            if (!newPass || !confirmPass) {
                errorEl.textContent = 'Both fields are required';
                errorEl.style.display = 'block';
                return;
            }
            if (newPass !== confirmPass) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }
            if (newPass.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.style.display = 'block';
                return;
            }

            const btn = document.getElementById('resetSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const resp = await fetch(API_BASE + '/settings/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPass }),
                });
                const data = await resp.json();

                if (resp.ok) {
                    document.getElementById('resetForm').style.display = 'none';
                    document.getElementById('resetSuccess').style.display = 'block';
                } else {
                    errorEl.textContent = data.error || 'Reset failed';
                    errorEl.style.display = 'block';
                    if (data.error && data.error.includes('expired')) {
                        document.getElementById('resetForm').style.display = 'none';
                        document.getElementById('resetExpired').style.display = 'block';
                    }
                }
            } catch (e) {
                errorEl.textContent = 'Cannot connect to server';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔒 Reset Password';
            }
        }
    </script>
</body>
</html>
